# Machine module: wsl (WSL2 Ubuntu with Windows host)
# Select with: mise -E wsl bootstrap
# Ghostty renders through WSLg.
#
# Docker is intentionally NOT installed here: the daemon comes from Docker
# Desktop on Windows via WSL Integration. Remember to enable it:
#   Docker Desktop > Settings > Resources > WSL Integration > enable this distro
#
# Tailscale is intentionally absent: inside WSL it needs userspace-networking
# mode (--tun=userspace-networking) and usually runs on the Windows host
# instead. Add it here if you really run tailscaled inside this distro.

[bootstrap.apt.sources]
ghostty = { ppa = "mkasberg/ghostty-ubuntu" }

[bootstrap.hooks]
final = "bash scripts/set-timezone-wsl.sh"

[bootstrap.packages]
"apt:ghostty" = "latest"
"apt:unzip" = "latest"   # system unzip: fonts task needs it, /usr/bin is on PATH for tasks
# build toolchain: `cargo` linking, `node-gyp` and `nvim-treesitter` parser builds
"apt:build-essential" = "latest"
"apt:pkg-config" = "latest"
"apt:libssl-dev" = "latest"
# system libs required by Puppeteer/Mermaid headless Chromium
"apt:libnspr4" = "latest"
"apt:libnss3" = "latest"
"apt:libasound2t64" = "latest"
