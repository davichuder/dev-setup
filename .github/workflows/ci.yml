name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          install: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trust the repo config
        run: mise trust .

      - name: Lint shell scripts
        run: mise run lint

      - name: Base bootstrap dry-run
        run: mise bootstrap --dry-run

      - name: Per-module bootstrap dry-runs
        run: |
          set -euo pipefail
          for m in wsl desktop server; do
            echo "::group::$m"
            mise -E "$m" bootstrap --dry-run
            echo "::endgroup::"
          done