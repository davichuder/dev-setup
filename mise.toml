# dev-setup — base configuration
# Applies to every machine (WSL2 Ubuntu, Ubuntu desktop, Ubuntu Server, Bazzite).
# Per-OS extras live in mise.<env>.toml machine modules, selected with:
#   mise -E <module> bootstrap
# Module selection is handled by bootstrap.sh; run it on a new machine.
# Version policy: lts where the project ships an LTS, otherwise latest.
# Secrets are never stored here — use [bootstrap.secrets] if you need templates.

[tasks]
lint.description = "Syntax check (bash -n) and ShellCheck every shell file in the repo"
lint.run = """
bash -n bootstrap.sh
bash -n scripts/install-fonts.sh
bash -n scripts/install-ghostty-bazzite.sh
bash -n scripts/set-timezone-wsl.sh
shellcheck -S warning bootstrap.sh scripts/*.sh
"""

[tools]
# Language runtimes (mise core tools)
node = "lts"
go = "latest"
python = "3.13"
java = "lts"
rust = "stable"

# Language package managers / build entry points
pnpm = "latest"
uv = "latest"

# Git & versioning
gh = "latest"
delta = "latest"
difftastic = "latest"
lazygit = "latest"

# Files, search and text
ripgrep = "latest"
fd = "latest"
fzf = "latest"
eza = "latest"
bat = "latest"
sd = "latest"
yazi = "latest"
dua = "latest"

# Data & markup
jq = "latest"
yq = "latest"
# pinned: aqua registry has no CLI asset for the 2.0.0 release yet;
# revisit "latest" once aqua:duckdb/duckdb covers 2.x
duckdb = "1.5.6"
glow = "latest"

# Monitoring & performance
bottom = "latest"
hyperfine = "latest"
watchexec = "latest"
dive = "latest"

# Navigation, shell UX and completions
zoxide = "latest"
carapace = "latest"
navi = "latest"
atuin = "latest"

# Quality / policy for the shell scripts in this repo (and any other shell code)
shellcheck = "latest"
shfmt = "latest"

# Used by `nvim-treesitter` when you later customize Neovim/LazyVim: the CLI
# and a C compiler (the compiler comes from the apt toolchain below).
"tree-sitter" = "latest"

# Docs & help (tealdeer provides the tldr command)
tealdeer = "latest"

# Networking / HTTP (httpie python original)
"pypi:httpie" = "latest"

# Coding agents & ecosystem
opencode = "latest"
pi = "latest"
"npm:gentle-pi" = "latest"   # gentle-shell; npm package name is gentle-pi until migration
gentle-ai = "latest"
lazyssh = "latest"
lazyjournal = "latest"
herdr = "latest"

# Containers
"github:docker/compose" = "latest"
lazydocker = "latest"

# Homebrew formulae installed WITHOUT needing Homebrew itself:
# mise downloads bottles from ghcr.io into /home/linuxbrew/.linuxbrew and
# writes Homebrew-compatible receipts (brew list works if brew is present).
[bootstrap.packages]
"brew:mise" = "latest"
"brew:git" = "latest"
"brew:zsh" = "latest"
"brew:neovim" = "latest"
"brew:wget" = "latest"
"brew:zip" = "latest"
"brew:unzip" = "latest"
"brew:rsync" = "latest"
"brew:htop" = "latest"
"brew:powerlevel10k" = "latest"
"brew:thefuck" = "latest"   # pypi backend is broken on python 3.13 (distutils gone)
"brew:llama.cpp" = "latest" # provides llama-cli/llama-server and the quantize helpers

# Activate mise in the login shell
[bootstrap.mise_shell_activate]
bash = true
zsh = true

# Key documented mise-getcha: the activation blocks call `mise` by name, so a
# mise.run install in ~/.local/bin needs PATH set in ~/.zshenv (zsh reads it first).
# mise bootstrap applies [dotfiles] BEFORE shell activation, so one run does both.
# These shell hooks are the difference between "binary installed" and "tool works":
# zoxide/carapace/fzf/thefuck need init lines, powerlevel10k needs its theme source
# (the brew prefix path is constant across every machine this repo provisions).
[dotfiles]
"~/.zshenv/mise-local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"' }
"~/.zshenv/brew-local-bin" = { line = 'export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"' }
"~/.zshrc/powerlevel10k-theme" = { line = 'source "/home/linuxbrew/.linuxbrew/opt/powerlevel10k/share/powerlevel10k/powerlevel10k.zsh-theme"' }
# fzf first, atuin last: both bind Ctrl-R; the later line wins, so history stays atuin
"~/.zshrc/fzf-hook" = { line = 'source <(fzf --zsh)' }
"~/.zshrc/zoxide-init" = { line = 'eval "$(zoxide init zsh)"' }
"~/.zshrc/carapace-completions" = { line = 'autoload -Uz compinit; compinit -C; source <(carapace _carapace)' }
"~/.zshrc/thefuck-alias" = { line = 'eval "$(thefuck --alias fuck)"' }
"~/.zshrc/atuin-init" = { line = 'eval "$(atuin init zsh)"' }

# Run idempotently on every bootstrap: the 6 core Nerd Fonts
[tasks.bootstrap]
run = "bash scripts/install-fonts.sh"
